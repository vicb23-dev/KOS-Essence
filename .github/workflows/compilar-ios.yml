
name: Compilar KOS Essence para iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode limpio
        run: xcodegen generate --spec project.yml

      # IPA para iPhone
      - name: Compilar KOS Essence para iPhone
        run: |
          xcodebuild \
            -project KOS_Essence.xcodeproj \
            -scheme KOS_Essence \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Crear IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KOS_Essence.app Payload/
          zip -r KOS-Essence.ipa Payload

      # Aplicación para Appetize.io
      - name: Compilar para simulador iOS
        run: |
          xcodebuild \
            -project KOS_Essence.xcodeproj \
            -scheme KOS_Essence \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Crear ZIP para Appetize
        run: |
          cd build-simulator/Build/Products/Release-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/KOS-Essence-Simulator.zip" KOS_Essence.app

      # Guardar ambos archivos
      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: KOS-Essence-IPA
          path: KOS-Essence.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Guardar versión Appetize
        uses: actions/upload-artifact@v4
        with:
          name: KOS-Essence-Appetize
          path: KOS-Essence-Simulator.zip
          if-no-files-found: error
          retention-days: 7
