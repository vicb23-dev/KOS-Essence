
name: Compilar KOS Essence para iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode limpio
        run: xcodegen generate --spec project.yml

      - name: Compilar KOS Essence
        run: |
          xcodebuild \
            -project KOS_Essence.xcodeproj \
            -scheme KOS_Essence \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Crear IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KOS_Essence.app Payload/
          cd Payload
          zip -r ../KOS-Essence.ipa KOS_Essence.app

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: KOS-Essence-IPA
          path: KOS-Essence.ipa
          if-no-files-found: error
          retention-days: 7
