
name: Compilar KOS Essence para iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcodebuild -list -project PuebloMagico.xcodeproj

      - name: Compilar aplicación
        run: |
          xcodebuild \
            -project PuebloMagico.xcodeproj \
            -scheme PuebloMagico \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Crear IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PuebloMagico.app Payload/
          /usr/bin/zip -r KOS-Essence.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: KOS-Essence-IPA
          path: KOS-Essence.ipa
          if-no-files-found: error
          retention-days: 7
